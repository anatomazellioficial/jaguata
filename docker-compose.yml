name: jaguata

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jaguata
      POSTGRES_USER: jaguata
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jaguata}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"      # só a máquina local enxerga o banco
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaguata -d jaguata"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caixa de e-mail de DESENVOLVIMENTO: captura tudo que o backend envia (verificação, senha) sem sair da máquina.
  # Veja os e-mails em http://localhost:8025. Em produção, remova este serviço e configure um SMTP real
  # (SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD, MAIL_FROM) e APP_BASE_URL com o endereço público.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    security_opt:
      - no-new-privileges:true

  # Redis: só para rodar VÁRIAS réplicas do backend (rate limit e bloqueio de login compartilhados).
  # Uso: docker compose --profile escala up -d   +   RATE_LIMIT_STORE=redis REDIS_HOST=redis
  redis:
    image: redis:7-alpine
    profiles: ["escala"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # E-mail transacional (verificação de conta, recuperação de senha, avisos de segurança)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Jaguatá <nao-responda@jaguata.local>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}   # base dos links nos e-mails (endereço público do frontend)
      DB_URL: jdbc:postgresql://db:5432/jaguata
      DB_USER: jaguata
      DB_PASSWORD: ${DB_PASSWORD:-jaguata}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (min. 32 bytes)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Rate limit. TRUSTED_PROXY_HOPS = nº de proxies reversos confiáveis na frente do FRONTEND
      # (0 = ignora X-Forwarded-For; só use >0 se o frontend NÃO for exposto diretamente).
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-0}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TOTP_KEY: ${TOTP_KEY:-}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTRO_PER_HOUR: ${RATE_LIMIT_REGISTRO_PER_HOUR:-5}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      RATE_LIMIT_CONSULTA_PER_MINUTE: ${RATE_LIMIT_CONSULTA_PER_MINUTE:-30}
      # Integrações externas (CNPJ/CEP). Precisam de saída para a internet; só trafegam dados públicos.
      BRASILAPI_URL: ${BRASILAPI_URL:-https://brasilapi.com.br}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080" # o navegador só fala com o frontend (BFF); API é interna
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
