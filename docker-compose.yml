name: jaguata

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jaguata
      POSTGRES_USER: jaguata
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jaguata}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaguata -d jaguata"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/jaguata
      DB_USER: jaguata
      DB_PASSWORD: ${DB_PASSWORD:-jaguata}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (min. 32 bytes)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
