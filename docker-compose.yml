name: jaguata

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jaguata
      POSTGRES_USER: jaguata
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jaguata}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"      # só a máquina local enxerga o banco
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaguata -d jaguata"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/jaguata
      DB_USER: jaguata
      DB_PASSWORD: ${DB_PASSWORD:-jaguata}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (min. 32 bytes)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Rate limit. TRUSTED_PROXY_HOPS = nº de proxies reversos confiáveis na frente do FRONTEND
      # (0 = ignora X-Forwarded-For; só use >0 se o frontend NÃO for exposto diretamente).
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-0}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTRO_PER_HOUR: ${RATE_LIMIT_REGISTRO_PER_HOUR:-5}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080" # o navegador só fala com o frontend (BFF); API é interna
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
