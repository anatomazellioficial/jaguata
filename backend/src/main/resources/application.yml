spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jaguata}
    username: ${DB_USER:jaguata}
    password: ${DB_PASSWORD:jaguata}
  jpa:
    hibernate:
      ddl-auto: validate   # o schema é gerenciado exclusivamente pelo Flyway
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50   # evita N+1 ao listar candidatos com tags
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  flyway:
    enabled: true
  data:
    redis:                       # usado só com RATE_LIMIT_STORE=redis (várias réplicas do backend)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms             # falha rápido: o limitador cai para o modo local se o Redis não responder
      repositories:
        enabled: false

server:
  max-http-request-header-size: 16KB
  error:                       # nunca expor mensagens internas ou stack traces
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  tomcat:
    max-swallow-size: 128KB

app:
  jwt:
    # OBRIGATÓRIO: segredo HS256 com no mínimo 32 bytes (ex.: openssl rand -base64 48). Sem default de propósito.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT15M}   # access token curto; a sessão longa é o refresh token rotativo (security.refresh-dias)
  admin:
    # Opcional: cria o primeiro ADMIN no startup se ainda não existir (senha com no mínimo 10 caracteres).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  integracoes:
    # CNPJ (Receita Federal) e CEP via BrasilAPI; coordenadas de reserva via OpenStreetMap/Nominatim.
    # Só trafegam CNPJ, CEP e nomes de rua/cidade (dados públicos), nunca dados de usuários.
    brasil-api-url: ${BRASILAPI_URL:https://brasilapi.com.br}
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    user-agent: ${INTEGRACOES_USER_AGENT:jaguata-plataforma/0.1}
    connect-timeout-ms: ${INTEGRACOES_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${INTEGRACOES_READ_TIMEOUT_MS:6000}
    nominatim-min-interval-ms: 1100
    cnpj-cache-hours: ${CNPJ_CACHE_HOURS:24}
    cep-cache-days: ${CEP_CACHE_DAYS:30}
  base-url: ${APP_BASE_URL:http://localhost:3000}     # base dos links enviados por e-mail
  mail:
    modo: ${MAIL_MODO:smtp}                              # smtp (padrão) | log (só desenvolvimento)
    from: ${MAIL_FROM:Jaguatá <nao-responda@jaguata.local>}
  security:
    refresh-dias: ${REFRESH_DIAS:30}
    token-email-horas: ${TOKEN_EMAIL_HORAS:24}
    token-senha-minutos: ${TOKEN_SENHA_MINUTOS:30}
    jwt-issuer: ${JWT_ISSUER:jaguata}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}      # falhas seguidas até bloquear a conta
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}     # duração do bloqueio
    max-body-bytes: ${MAX_BODY_BYTES:65536}
    refresh-grace-segundos: ${REFRESH_GRACE_SEGUNDOS:10}   # tolerância a renovações simultâneas do mesmo refresh token
    sessao-cache-segundos: ${SESSAO_CACHE_SEGUNDOS:5}      # cache da checagem "sessão ativa" do access token
    totp-chave: ${TOTP_KEY:}                               # cifra dos segredos 2FA; vazia = derivada de JWT_SECRET
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}      # por IP
      registro-per-hour: ${RATE_LIMIT_REGISTRO_PER_HOUR:5}     # por IP
      api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:120}         # por usuário (ou IP sem token)
      consulta-per-minute: ${RATE_LIMIT_CONSULTA_PER_MINUTE:30} # consultas de CNPJ/CEP
      conta-per-hour: ${RATE_LIMIT_CONTA_PER_HOUR:10}           # e-mails transacionais (verificar/esqueci senha), por IP
      # Nº de proxies CONFIÁVEIS na frente do backend. 0 = ignora X-Forwarded-For (seguro por padrão).
      trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
      store: ${RATE_LIMIT_STORE:memory}                        # memory | redis (compartilha limites e bloqueio de login entre réplicas)
