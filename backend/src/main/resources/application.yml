spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jaguata}
    username: ${DB_USER:jaguata}
    password: ${DB_PASSWORD:jaguata}
  jpa:
    hibernate:
      ddl-auto: validate   # o schema é gerenciado exclusivamente pelo Flyway
    open-in-view: false
  flyway:
    enabled: true

server:
  max-http-request-header-size: 16KB
  error:                       # nunca expor mensagens internas ou stack traces
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  tomcat:
    max-swallow-size: 128KB

app:
  jwt:
    # OBRIGATÓRIO: segredo HS256 com no mínimo 32 bytes (ex.: openssl rand -base64 48). Sem default de propósito.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT1H}
  admin:
    # Opcional: cria o primeiro ADMIN no startup se ainda não existir (senha com no mínimo 10 caracteres).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  security:
    jwt-issuer: ${JWT_ISSUER:jaguata}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}      # falhas seguidas até bloquear a conta
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}     # duração do bloqueio
    max-body-bytes: ${MAX_BODY_BYTES:65536}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}      # por IP
      registro-per-hour: ${RATE_LIMIT_REGISTRO_PER_HOUR:5}     # por IP
      api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:120}         # por usuário (ou IP sem token)
      # Nº de proxies CONFIÁVEIS na frente do backend. 0 = ignora X-Forwarded-For (seguro por padrão).
      trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
